<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yahoo Scoreboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
    <div class="max-w-7xl mx-auto">
        <h1 class="text-3xl font-black tracking-wider mb-8">YAHOO SCOREBOARD</h1>
        <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <p class="text-slate-500">Loading scores...</p>
        </div>
    </div>

    <script>
        async function loadScores() {
            try {
                const response = await fetch('games.json');
                const games = await response.json();
                const grid = document.getElementById('grid');
                grid.innerHTML = '';

                games.forEach(game => {
                    const card = document.createElement('div');
                    card.className = "bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg";
                    card.innerHTML = `
                        <div class="text-xs font-semibold text-emerald-400 mb-3">${game.status}</div>
                        <div class="space-y-3">
                            <div class="flex justify-between items-center">
                                <div class="flex items-center space-x-3">
                                    <img src="${game.awayTeam.logo}" class="w-6 h-6 object-contain" />
                                    <span class="font-medium">${game.awayTeam.name}</span>
                                </div>
                                <span class="text-lg font-bold">${game.awayTeam.score}</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <div class="flex items-center space-x-3">
                                    <img src="${game.homeTeam.logo}" class="w-6 h-6 object-contain" />
                                    <span class="font-medium">${game.homeTeam.name}</span>
                                </div>
                                <span class="text-lg font-bold">${game.homeTeam.score}</span>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error("Could not load games.json", err);
            }
        }
        loadScores();
    </script>
</body>
</html>
