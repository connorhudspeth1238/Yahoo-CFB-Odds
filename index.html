<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yahoo Scoreboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
    <div class="max-w-7xl mx-auto">
        <h1 class="text-3xl font-black tracking-wider mb-8">YAHOO SCOREBOARD</h1>
        <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <p class="text-slate-500">Loading scores...</p>
        </div>
    </div>

    <script>
        async function loadScores() {
            try {
                const response = await fetch('games.json');
                const games = await response.json();
                const grid = document.getElementById('grid');
                grid.innerHTML = '';

                if (games.length === 0) {
                    grid.innerHTML = `<p class="text-slate-500">No games found.</p>`;
                    return;
                }

                games.forEach(game => {
                    const card = document.createElement('div');
                    card.className = "bg-white text-slate-900 border border-slate-300 rounded-lg p-5 shadow-sm hover:shadow-md transition flex flex-col justify-between";
                    
                    // Format team rows helper
                    const renderTeamRow = (team) => `
                        <div class="flex justify-between items-center">
                            <div class="flex items-center space-x-3">
                                <img src="${team.logo || ''}" class="w-8 h-8 object-contain" alt="" />
                                <div>
                                    <div class="flex items-center space-x-1.5 font-bold text-base">
                                        ${team.rank ? `<span>(${team.rank})</span>` : ''}
                                        <span>${team.name}</span>
                                    </div>
                                    ${team.mascot ? `<div class="text-xs text-slate-500 font-medium">${team.mascot}</div>` : ''}
                                </div>
                            </div>
                            <div class="text-lg font-bold">
                                ${game.status === 'UPCOMING' ? (team.record || '') : (team.score || team.record || '')}
                            </div>
                        </div>
                    `;

                    card.innerHTML = `
                        <div>
                            <!-- Datetime header -->
                            <div class="flex justify-end text-xs font-bold text-slate-800 mb-4">
                                <span>${game.datetime || ''}</span>
                            </div>

                            <!-- Teams Block -->
                            <div class="space-y-4 mb-5">
                                ${renderTeamRow(game.awayTeam)}
                                ${renderTeamRow(game.homeTeam)}
                            </div>
                        </div>

                        <!-- Footer Details (Odds & TV) -->
                        <div class="border-t border-slate-200 pt-3 mt-2 flex justify-between items-center text-xs font-semibold text-slate-700">
                            <span>${game.odds ? `Odds: ${game.odds}` : ''}</span>
                            <span>${game.tv ? `TV: ${game.tv}` : ''}</span>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error("Could not load games.json", err);
                document.getElementById('grid').innerHTML = `<p class="text-red-400">Failed to load games data.</p>`;
            }
        }

        loadScores();
    </script>
</body>
</html>
